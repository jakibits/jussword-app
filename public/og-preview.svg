<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="50%" stop-color="#0E1019" />
      <stop offset="100%" stop-color="#141624" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#4F46E5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A28" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#12141F" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#ambientGlow)" />

  <!-- Logo Mark Lockup -->
  <g transform="translate(600, 140)">
    <!-- Brand Icon -->
    <rect x="-170" y="-45" width="60" height="60" rx="16" fill="#1E2235" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <text x="-148" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" text-anchor="middle" fill="#FFFFFF">j</text>
    <text x="-130" y="-18" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="900" text-anchor="middle" fill="#818CF8">*</text>

    <!-- Wordmark -->
    <text x="-90" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="56" font-weight="800" letter-spacing="-1" fill="#FFFFFF">jussword</text>

    <!-- Tagline with subtle ju + s + s + word highlights -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="20" font-weight="500" letter-spacing="1" text-anchor="middle">
      <tspan font-weight="800" fill="#FFFFFF">ju</tspan><tspan fill="#94A3B8">st a </tspan><tspan font-weight="800" fill="#FFFFFF">s</tspan><tspan fill="#94A3B8">imple </tspan><tspan font-weight="800" fill="#FFFFFF">s</tspan><tspan fill="#94A3B8">ecure pass</tspan><tspan font-weight="800" fill="#FFFFFF">word</tspan><tspan fill="#94A3B8"> generator</tspan>
    </text>
  </g>

  <!-- Central Password Display Card Mockup -->
  <g transform="translate(600, 360)">
    <rect x="-380" y="-90" width="760" height="180" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
    
    <!-- Password Box -->
    <rect x="-340" y="-60" width="680" height="74" rx="14" fill="#0A0B10" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- 14 Left-Aligned Masked Password Dots (Exact Live App Proportions) -->
    <g transform="translate(0, -23)">
      <circle cx="-290" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-262" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-234" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-206" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-178" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-150" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-122" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-94" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-66" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-38" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="-10" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="18" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="46" cy="0" r="5" fill="#F8FAFC" />
      <circle cx="74" cy="0" r="5" fill="#F8FAFC" />
    </g>

    <!-- Exact Lucide Eye Icon (Right side) -->
    <g transform="translate(236, -35)">
      <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="12" r="3" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Exact Lucide Copy Icon (Right side with proper spacing) -->
    <g transform="translate(284, -35)">
      <rect width="13" height="13" x="8" y="8" rx="2" ry="2" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Strength Gauge (Electric Indigo / Rock Solid) -->
    <g transform="translate(-340, 34)">
      <rect x="0" y="0" width="160" height="6" rx="3" fill="#6366F1" />
      <rect x="170" y="0" width="160" height="6" rx="3" fill="#6366F1" />
      <rect x="340" y="0" width="160" height="6" rx="3" fill="#6366F1" />
      <rect x="510" y="0" width="170" height="6" rx="3" fill="#6366F1" />
    </g>

    <!-- Metrics -->
    <text x="-340" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#818CF8">Rock Solid</text>
    <text x="-250" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="500" fill="#64748B">• Several centuries</text>
    <text x="340" y="60" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="500" text-anchor="end" fill="#64748B">14 chars</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(600, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="15" font-weight="500" text-anchor="middle" fill="#64748B">
      🔒 100% Client-Side • Hardware Cryptography • Zero Data Leaves Your Browser
    </text>
  </g>
</svg>